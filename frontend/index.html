<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>سامانه بیمه تکمیلی</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Apply the saved theme before React mounts to avoid a light/dark flash.
         localStorage "theme": "light" | "dark" | absent (= follow the OS). -->
    <script>
      ;(function () {
        var t = localStorage.getItem('theme')
        var dark = t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
