services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: insurance
      POSTGRES_PASSWORD: insurance
      POSTGRES_DB: insurance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insurance -d insurance"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The out-of-the-box compose stack is a demo/dev environment. Real
      # deployments must set APP_ENV=production AND a strong JWT_SECRET —
      # the backend refuses to boot in production with the dev fallback.
      APP_ENV: ${APP_ENV:-development}
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://insurance:insurance@postgres:5432/insurance?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      JWT_TTL: 8h
      DB_INIT_PATH: /app/db/init.sql
      ATTACHMENTS_DIR: /app/data/attachments
    volumes:
      # Uploaded claim documents are on disk, not in the database, so they need
      # their own durable volume.
      - attachments:/app/data/attachments
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_BASE_URL: ${API_BASE_URL:-/api/v1}
    ports:
      - "5173:80"

volumes:
  pgdata:
  attachments:
