# Alternate-port overlay: use when the default host ports (8080/5173/5432) are
# taken by other projects. Frontend on 15173, API on 18080, Postgres unexposed.
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.altports.yml up -d --build
# Remember VITE_API_BASE_URL/CORS_ORIGIN must match these ports (see deploy/.env.example).
services:
  postgres:
    ports: !override []
  backend:
    ports: !override
      - "18080:8080"
  frontend:
    ports: !override
      - "15173:80"
